<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lp-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lp-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lp-grad-pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="lp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#lp-grad-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Dynamic Launch Pulse Waves (Rocket / Pulse Geometry) -->
  <g filter="url(#lp-glow)">
    <!-- Speed Wing Left -->
    <path d="M14 44 C18 36, 26 28, 32 14 C30 26, 24 34, 18 42 Z" fill="url(#lp-grad-primary)" opacity="0.85"/>
    
    <!-- Speed Wing Right -->
    <path d="M50 44 C46 36, 38 28, 32 14 C34 26, 40 34, 46 42 Z" fill="url(#lp-grad-primary)" opacity="0.85"/>

    <!-- Central Rocket Thrust / Core Spire -->
    <path d="M32 12 C34 22, 38 32, 40 40 L32 37 L24 40 C26 32, 30 22, 32 12 Z" fill="url(#lp-grad-primary)"/>

    <!-- Pulse ECG / Energy Beat Wave inside thrust -->
    <path d="M21 47 L28 47 L30 43 L32 51 L34 45 L36 47 L43 47" stroke="url(#lp-grad-pulse)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Pulse Core Dot -->
    <circle cx="32" cy="27" r="3" fill="#ffffff"/>
  </g>
</svg>

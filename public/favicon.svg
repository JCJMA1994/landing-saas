<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="fav-bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="fav-chevron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Tile Container -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- High Contrast Aerodynamic Launch Arrow & Pulse -->
  <g filter="url(#glow-drop)">
    <!-- Aerodynamic Chevron -->
    <path d="M12 44 L32 10 L52 44 L40 40 L32 24 L24 40 Z" fill="url(#fav-chevron)"/>
    
    <!-- Pulse Wave -->
    <path d="M22 50 L27 50 L30 43 L32 54 L35 47 L38 50 L42 50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Core Spark -->
    <circle cx="32" cy="27" r="4" fill="#ffffff"/>
  </g>
</svg>
